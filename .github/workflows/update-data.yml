name: Update football data

on:
  workflow_dispatch:
  schedule:
    # Tuesday morning catches the usual Monday-night match at a quiet UTC minute.
    - cron: "17 6 * * 2"

permissions:
  contents: write

concurrency:
  group: weekly-football-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -v
      - name: Update current results, xG and odds
        run: python update_data.py --incremental
      - name: Commit changed data
        run: |
          if git diff --quiet -- data/; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/england_top2_results.csv data/epl_xg.csv data/football_data_odds.csv
          git commit -m "Update weekly football data"
          git push
